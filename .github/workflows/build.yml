name: build
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix Kotlin version to 2.2.0
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.rbihi.companion --project-name companion_ai --no-pub
          # رفع Kotlin من 1.9.0 -> 2.2.0 باش يخدم مع flutter_tts 4.0.2
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.0"/' android/settings.gradle
          sed -i 's/kotlin_version = .*/kotlin_version = '\''2.2.0'\''/' android/build.gradle || true
          cat android/settings.gradle | grep kotlin
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
